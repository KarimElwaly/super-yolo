task: train

defaults:
  - validation: ../validation

epoch: 500

data:
  batch_size: 16
  equivalent_batch_size: 64
  image_size: ${image_size}
  cpu_num: ${cpu_num}
  shuffle: True
  pin_memory: True
  data_augment:
    Mosaic: 1
    # MixUp: 1
    # HorizontalFlip: 0.5
    RandomCrop: 1
    RemoveOutliers: 1e-8

optimizer:
  type: SGD
  args:
    lr: 0.01
    weight_decay: 0.0005
    momentum: 0.937
    nesterov: true

loss:
  objective:
    BCELoss: 0.5
    BoxLoss: 7.5
    DFLoss: 1.5
  aux:
    0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 6.0
      cls: 0.5

scheduler:
  type: LinearLR
  warmup:
    epochs: 3.0
  args:
    total_iters: ${task.epoch}
    start_factor: 1
    end_factor: 0.01

ema:
  enable: true
  decay: 0.9999

# Opt-in training enhancements (all disabled by default to preserve vanilla training)
# Native resolution overrides: `image_size=[480,480]`, `[512,512]`, or `[640,640]`
close_mosaic: 0 # Set e.g. 15 to disable Mosaic/MixUp during final N epochs
multi_scale: false # Set true to jitter image_size (+/-20%, multiples of 32) per epoch
multi_scale_range: [0.8, 1.2]

distill:
  enabled: false
  teacher_model: v9-m
  teacher_weights: null
  lambda_kd: 1.0
  feature_weight: 0.5
  logit_weight: 0.5
  temperature: 1.0
  feature_tags: ["P3", "P4", "P5"]
